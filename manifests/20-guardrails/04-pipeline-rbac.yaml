# the guardrails route sits behind kube-rbac-proxy, confirmed live by
# reading rag-phase1-guardrails-rbac-proxy-config: it does a
# SubjectAccessReview for "get" on the services/rag-phase1-guardrails-service
# resource specifically, not a plain "is this any authenticated identity"
# check. that means the kfp pipeline's own service account (pipeline-runner
# on this dspa, ds-pipeline-workload-runner-<dspa> on newer ones) needs
# exactly that one permission, nothing broader, to call the route from
# inside a pipeline component using its own projected service account
# token as the bearer token (the in cluster equivalent of `oc whoami -t`).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rag-phase1-guardrails-caller
  namespace: rag-phase1
rules:
  - apiGroups: [""]
    resources: ["services"]
    resourceNames: ["rag-phase1-guardrails-service"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rag-phase1-guardrails-caller-pipeline-runner
  namespace: rag-phase1
subjects:
  - kind: ServiceAccount
    name: pipeline-runner-rag-phase1-dspa
    namespace: rag-phase1
roleRef:
  kind: Role
  name: rag-phase1-guardrails-caller
  apiGroup: rbac.authorization.k8s.io
