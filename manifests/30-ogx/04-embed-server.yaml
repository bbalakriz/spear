# self hosted text-embeddings-inference (tei) server, standing in for
# an embedding model with a real, sufficient context length. see the
# header comment in 01-ogxserver.yaml's embedding section for the full
# story of why: litemaas's Nomic-embed-text-v2-moe
# is hard capped at 512 tokens server side despite advertising 2,048 on
# its catalog page, and Gemini's OpenAI compatible embeddings endpoint
# crashes ogx's bundled client code (no usage field in its response)
# and returns 3072 dims instead of the 768 this project's pgvector
# schema uses.
#
# three real bugs had to be worked around to get this running, in case
# this ever needs to be rebuilt or bumped:
#   1. the cpu-1.5 image tag has a genuine upstream bug ("Could not
#      download model artifacts / relative URL without a base") on
#      basically any model, fixed in cpu-1.7, see
#      https://github.com/huggingface/text-embeddings-inference/issues/527
#   2. openshift's restricted scc runs the container as a random non
#      root uid, but the image's own baked in /data dir is root owned,
#      so an emptyDir volume is mounted over /data instead of writing
#      into the image's copy directly
#   3. nomic-ai/nomic-embed-text-v1.5's current main revision on
#      huggingface hub has a config.json regression (a duplicate
#      max_position_embeddings key) that tei's strict rust json parser
#      rejects, see
#      https://huggingface.co/nomic-ai/nomic-embed-text-v1.5/discussions/58
#      fixed here by pinning --revision to the commit right before that
#      regression landed
#   4. this model's cpu (no flash attention) attention is quadratic in
#      sequence length, so both the warmup pass and any real request
#      near the model's true 8192 token max briefly need far more
#      memory than the model's own size on disk would suggest.
#      autorag's own context length probe (a binary search up to 8192
#      tokens, see ai4rag's ogx.py::_detect_context_length) genuinely
#      OOM killed this pod at a 24gi limit partway through, confirmed
#      by the exact timestamp of the pod restart lining up with the
#      binary search's failing probe. bumped to 48gi and directly
#      verified two real embedding calls at 8065 and 8190 words both
#      succeed cleanly with no restart, confirmed empirically on this
#      cluster 2026-09-27
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-phase1-embed-server
  namespace: rag-phase1
  labels:
    app: rag-phase1-embed-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rag-phase1-embed-server
  template:
    metadata:
      labels:
        app: rag-phase1-embed-server
    spec:
      containers:
        - name: tei
          image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.7
          # pinned to the commit right before nomic-ai's "v5 Transformers"
          # config regression, see bug 3 above
          args: ["--model-id", "nomic-ai/nomic-embed-text-v1.5", "--revision", "e5cf08aadaa33385f5990def41f7a23405aec398", "--port", "8080"]
          env:
            - name: HF_ENDPOINT
              value: https://huggingface.co
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "500m"
              memory: "2Gi"
            limits:
              cpu: "2"
              memory: "48Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 30
          # a single large (near 8192 token) real embedding request
          # pegs both cpu cores for 50+ seconds, starving the async
          # runtime's ability to even answer /health within the
          # default 1s probe timeout. that was silently killing this
          # pod mid request (a clean sigterm, not an oom) every time
          # autorag's own context length probe reached its largest
          # sizes, confirmed by lining up the pod's own "signal
          # received, starting graceful shutdown" log line with the
          # exact timestamp of the request that got cut off,
          # 2026-09-27. generous timeoutSeconds/failureThreshold here
          # so one slow request never looks like 10 consecutive
          # liveness failures
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 15
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        # see bug 2 above, emptyDir is writable by the pod's assigned
        # fsGroup, the image's own /data is not
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: rag-phase1-embed-server
  namespace: rag-phase1
spec:
  selector:
    app: rag-phase1-embed-server
  ports:
    - port: 80
      targetPort: 8080
