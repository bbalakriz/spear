# credentials the owner-console-backend needs to do a real password grant
# against the spear-shield-agents realm on behalf of whichever real human
# is signed into the openshift console, section 8. the console backend
# only ever learns the signed in user's openshift username (resolved from
# their forwarded console token via a users.openshift.io/v1/users/~ self
# lookup), not their password, so it needs its own lookup from username to
# that user's own spear-shield-agents realm password, same per persona
# file-by-username shape spear-openproject-mcp's own OPENPROJECT_TOKENS_DIR
# already uses for the exact same kind of problem.
#
# these two literal values are not new secrets, they are copied straight
# out of 01-keycloak-realm.yaml's own credentials.value fields for
# balakrishnan.b and siddhartha.de. this is demo-only duplication, a real
# deployment would mint these through an actual identity provider flow
# instead of a fixed password known to this backend, but there is no sso
# federation between the console's own openshift oauth and the
# spear-shield-agents realm to do that with here.
#
# namespace is rag-phase1, not spear-shield-agents, because that is where
# the owner-console-backend pod that actually mounts this lives, a plain
# secret can't be mounted cross namespace. this cross namespace credential
# placement is exactly the kind of elementary layout this project's own
# NAMESPACE_MIGRATION_PLAN.md already flags for cleanup once spear-console
# gets its own real home
apiVersion: v1
kind: Secret
metadata:
  name: spear-shield-console-creds
  namespace: rag-phase1
  labels:
    app.kubernetes.io/part-of: spear-shield-agents
type: Opaque
stringData:
  balakrishnan.b: jU6Gi8s7oIEGCLtHJzPPiRYF
  siddhartha.de: 6LK7BC1K5YxxgIqbAJaYBJ
---
# same reasoning, copied from 01-keycloak-realm.yaml's spear-coordinator
# client's own secret field. the backend needs this to complete the
# password grant, same client the coordinator agent's own tool scoping
# already expects tokens to come from
apiVersion: v1
kind: Secret
metadata:
  name: spear-coordinator-client-secret
  namespace: rag-phase1
  labels:
    app.kubernetes.io/part-of: spear-shield-agents
type: Opaque
stringData:
  client-secret: f505e68dafacd8e440db4fef433366974f49079da21d8f28
