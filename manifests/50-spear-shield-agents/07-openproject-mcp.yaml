# same MCPServer / HTTPRoute / MCPServerRegistration / MCPVirtualServer
# shape as the reference's own manifests/10-agent-pack/01-mcp-calculator.yaml,
# rebuilt for the real openproject backend. userSpecificList: Enabled
# below is the one field that shape did not need, this server genuinely
# returns different tool availability per caller in principle (checked
# live against oc explain mcpserverregistration.spec, section 4), even
# though today both tools are always listed and the actual gate is
# tool level rbac at the gateway, not per user tools/list filtering.
apiVersion: mcp.x-k8s.io/v1alpha1
kind: MCPServer
metadata:
  name: spear-openproject-mcp
  namespace: spear-shield-agents
  labels:
    app: spear-openproject-mcp
spec:
  source:
    type: ContainerImage
    containerImage:
      ref: image-registry.openshift-image-registry.svc:5000/openshift/python:3.12-ubi9
  mcp:
    stateless: true
  extraLabels:
    app: spear-openproject-mcp
  config:
    port: 8000
    path: /mcp
    arguments:
      - python3
      - /mcp/server.py
    env:
      - name: MCP_BACKEND_SECRET
        valueFrom:
          secretKeyRef:
            name: spear-openproject-mcp-backend-secret
            key: token
      - name: OPENPROJECT_INTERNAL_URL
        value: http://spear-openproject.spear-shield-agents.svc.cluster.local:8080
      - name: OPENPROJECT_HOST_HEADER
        value: OPENPROJECT_HOST_PLACEHOLDER
      - name: OPENPROJECT_PROJECT_IDENTIFIER
        value: data-governance
      - name: OPENPROJECT_TOKENS_DIR
        value: /var/run/secrets/openproject-tokens
    storage:
      - path: /mcp
        permissions: ReadOnly
        source:
          type: ConfigMap
          configMap:
            name: spear-openproject-mcp-code
      - path: /var/run/secrets/openproject-tokens
        permissions: ReadOnly
        source:
          type: Secret
          secret:
            secretName: spear-openproject-api-tokens
  runtime:
    replicas: 1
    health:
      readinessProbe:
        httpGet:
          path: /health
          port: 8000
        initialDelaySeconds: 2
        periodSeconds: 5
      livenessProbe:
        httpGet:
          path: /health
          port: 8000
        initialDelaySeconds: 5
        periodSeconds: 10
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: spear-openproject-mcp
  namespace: spear-shield-agents
  labels:
    mcp-server: "true"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: spear-shield-gateway
      namespace: spear-shield-agents
  hostnames:
    - spear-openproject-mcp.mcp.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      # same direct-bypass close as calculator-mcp's own httproute,
      # section 4: this header only reaches the backend for a real
      # client's tools/call, hairpinned by envoy's ext_proc, never for
      # the broker's own separate admin connection
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: X-Spear-Shield-Backend-Secret
                value: MCP_BACKEND_SECRET_PLACEHOLDER
      backendRefs:
        # points at the guard proxy, not this server directly, confirmed
        # live this backendref was hand patched during this session and
        # never written back here until now, see 08-mcp-guard-proxy.yaml's
        # own comment for why this hop exists
        - name: spear-shield-mcp-guard-proxy
          port: 8000
---
apiVersion: mcp.kuadrant.io/v1alpha1
kind: MCPServerRegistration
metadata:
  name: spear-openproject-mcp
  namespace: spear-shield-agents
spec:
  prefix: openproject_
  hint: real work packages in the self hosted openproject data governance project
  # confirmed real via oc explain, section 4: forwards each caller's own
  # session headers on every tools/list rather than caching one service
  # account view. this server's own tools/list is not yet caller
  # dependent, but this is the honest, forward compatible setting given
  # the actual per persona rbac lives at the gateway's tool level check,
  # not in this server's tool catalog
  userSpecificList: Enabled
  credentialRef:
    name: spear-openproject-mcp-backend-secret
    key: token
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: spear-openproject-mcp
    namespace: spear-shield-agents
---
apiVersion: mcp.kuadrant.io/v1alpha1
kind: MCPVirtualServer
metadata:
  name: spear-openproject-tools
  namespace: spear-shield-agents
spec:
  description: real openproject work package tools, gated by per tool rbac
  tools:
    - openproject_search_work_packages
    - openproject_update_work_package
