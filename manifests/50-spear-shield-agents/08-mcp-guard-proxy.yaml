# externalized, gateway side request/response guardrail enforcement for
# spear-openproject-mcp, without touching that server's own code, see
# mcp-servers/spear-shield-mcp-guard-proxy/server.py for why this exists
# instead of wiring nemo-request-guard/nemo-response-guard as a second
# envoy ext_proc filter (a real, open upstream bug, confirmed live this
# same investigation).
#
# plain Deployment + Service on purpose, not an MCPServer CR: this is a
# transparent proxy, not an mcp tool server in its own right, it never
# needs a userSpecificList or its own MCPServerRegistration, the existing
# spear-openproject-mcp HTTPRoute/MCPServerRegistration/MCPVirtualServer
# in 07-openproject-mcp.yaml are reused unchanged, only that httproute's
# backendref moves from the real backend to this proxy
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spear-shield-mcp-guard-proxy
  namespace: spear-shield-agents
  labels:
    app: spear-shield-mcp-guard-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spear-shield-mcp-guard-proxy
  template:
    metadata:
      labels:
        app: spear-shield-mcp-guard-proxy
    spec:
      containers:
        - name: guard-proxy
          image: image-registry.openshift-image-registry.svc:5000/openshift/python:3.12-ubi9
          command: ["python3", "/mcp/server.py"]
          ports:
            - containerPort: 8000
          env:
            - name: UPSTREAM_URL
              value: http://spear-openproject-mcp.spear-shield-agents.svc.cluster.local:8000/mcp
            - name: GUARDRAILS_ROUTE
              value: https://rag-phase1-guardrails-rag-phase1.apps.cluster-rf7lv.dyn.redhatworkshops.io
            - name: GUARDRAILS_CONFIG_ID
              value: work-tracker-config
          volumeMounts:
            - name: code
              mountPath: /mcp
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: code
          configMap:
            name: spear-shield-mcp-guard-proxy-code
---
apiVersion: v1
kind: Service
metadata:
  name: spear-shield-mcp-guard-proxy
  namespace: spear-shield-agents
  labels:
    app: spear-shield-mcp-guard-proxy
spec:
  selector:
    app: spear-shield-mcp-guard-proxy
  ports:
    - port: 8000
      targetPort: 8000
