# spear-shield-ogx-relay's own service account, dedicated rather than
# riding on rag-phase1's own default one, and the rbac it needs to call
# rag-phase1-guardrails, same plain unscoped "get services" shape as
# 09-guardrails-rbac.yaml, not the resourceName scoped one in
# 04-pipeline-rbac.yaml, confirmed live in that earlier investigation
# that the resourceName scoped version silently 403s despite a passing
# subjectaccessreview, this project's own role, not the shared one
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spear-shield-ogx-relay
  namespace: rag-phase1
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rag-phase1-guardrails-caller-spear-shield-ogx-relay
  namespace: rag-phase1
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rag-phase1-guardrails-caller-spear-shield-ogx-relay
  namespace: rag-phase1
subjects:
  - kind: ServiceAccount
    name: spear-shield-ogx-relay
    namespace: rag-phase1
roleRef:
  kind: Role
  name: rag-phase1-guardrails-caller-spear-shield-ogx-relay
  apiGroup: rbac.authorization.k8s.io
