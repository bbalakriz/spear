# plain http relay for ogx embeddings, deployed inside rag-phase1 itself,
# not spear-shield-agents, for one concrete reason confirmed live: ogx's
# own NetworkPolicy (rag-phase1-ogx-network-policy, owned by the
# ogx-operator) only allows ingress from pods already inside rag-phase1
# plus redhat-ods-applications, and a direct edit to that policy gets
# silently reverted by the operator's own reconciler within seconds,
# confirmed by patching it live and immediately re-reading it back
# unchanged. a relay pod that itself lives inside rag-phase1 already
# satisfies that same namespace rule, same shape as
# manifests/50-spear-shield-agents/openshell/auth-token-relay.yaml, a
# different constraint, the same kind of fix.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spear-shield-ogx-relay
  namespace: rag-phase1
  labels:
    app.kubernetes.io/part-of: spear-shield-agents
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spear-shield-ogx-relay
  template:
    metadata:
      labels:
        app: spear-shield-ogx-relay
    spec:
      containers:
        - name: relay
          image: registry.access.redhat.com/ubi9/python-312:latest
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: TARGET
              value: http://rag-phase1-ogx-service.rag-phase1.svc.cluster.local:8321
          command:
            - python3
            - -c
            - |
              import os
              import urllib.request
              from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

              target = os.environ["TARGET"].rstrip("/")

              class Handler(BaseHTTPRequestHandler):
                  def do_GET(self) -> None:
                      self._relay("GET")

                  def do_POST(self) -> None:
                      self._relay("POST")

                  def _relay(self, method: str) -> None:
                      length = int(self.headers.get("content-length", "0"))
                      body = self.rfile.read(length) if length else None
                      req = urllib.request.Request(f"{target}{self.path}", data=body, method=method)
                      for key, value in self.headers.items():
                          if key.lower() != "host":
                              req.add_header(key, value)
                      try:
                          with urllib.request.urlopen(req, timeout=30) as resp:
                              payload = resp.read()
                              self.send_response(resp.status)
                              for key, value in resp.headers.items():
                                  if key.lower() not in ("transfer-encoding", "connection"):
                                      self.send_header(key, value)
                              self.end_headers()
                              if payload:
                                  self.wfile.write(payload)
                      except urllib.error.HTTPError as exc:
                          payload = exc.read()
                          self.send_response(exc.code)
                          self.end_headers()
                          if payload:
                              self.wfile.write(payload)

              ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: v1
kind: Service
metadata:
  name: spear-shield-ogx-relay
  namespace: rag-phase1
  labels:
    app.kubernetes.io/part-of: spear-shield-agents
spec:
  selector:
    app: spear-shield-ogx-relay
  ports:
    - name: http
      port: 8080
      targetPort: 8080
