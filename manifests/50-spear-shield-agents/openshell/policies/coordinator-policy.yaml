version: 1
filesystem_policy:
  include_workdir: true
  read_only:
    - /usr
    - /lib
    - /lib64
    - /opt
    - /etc
    - /proc
    - /dev/urandom
  read_write:
    - /sandbox
    - /tmp
    - /dev/null
landlock:
  compatibility: best_effort
network_policies:
  cluster_auth:
    name: cluster-auth
    endpoints:
      # the sandbox supervisor's own token_grant provider needs to reach
      # keycloak to mint this sandbox's workload access token, same
      # reason the reference needed its own auth-token-relay: the
      # sandbox's rest protocol handler only bridges plain http, so a
      # plain http to https relay stands in front of the real keycloak
      # hostname, see manifests/50-spear-shield-agents/openshell/auth-token-relay.yaml
      - host: spear-shield-auth-token.spear-shield-agents.svc.cluster.local
        # service name is spear-shield-auth-token, the -relay suffix only
        # applies to the deployment name, see auth-token-relay.yaml
        port: 8080
        protocol: rest
        enforcement: enforce
        access: read-write
        allowed_ips:
          - CLUSTER_NETWORK_CIDR_PLACEHOLDER
          - SERVICE_NETWORK_CIDR_PLACEHOLDER
    binaries:
      - path: /usr/bin/python3*
      - path: /usr/local/bin/python3*
      - path: /opt/app-root/bin/python3*
  cluster_ogx:
    name: cluster-ogx
    endpoints:
      # the generation model call, glm-53-flash's own real tool calling
      # confirmed live before this policy was written, not assumed.
      # routed through spear-shield-ogx-relay, not ogx's own service
      # directly, same NetworkPolicy constraint spear-retrieval-agent's
      # own policy hit live, see ../ogx-relay.yaml's own comment
      - host: spear-shield-ogx-relay.rag-phase1.svc.cluster.local
        port: 8080
        protocol: rest
        enforcement: enforce
        access: read-write
        allowed_ips:
          - CLUSTER_NETWORK_CIDR_PLACEHOLDER
          - SERVICE_NETWORK_CIDR_PLACEHOLDER
    binaries:
      - path: /usr/bin/python3*
      - path: /usr/local/bin/python3*
      - path: /opt/app-root/bin/python3*
  cluster_retrieval:
    name: cluster-retrieval
    endpoints:
      # routed through this project's own second, independent openshell
      # release, see manifests/50-spear-shield-agents/11-a2a-gateway.yaml
      - host: spear-retrieval-a2a-gateway.spear-shield-agents.svc.cluster.local
        port: 80
        protocol: rest
        enforcement: enforce
        access: read-write
        allowed_ips:
          - CLUSTER_NETWORK_CIDR_PLACEHOLDER
          - SERVICE_NETWORK_CIDR_PLACEHOLDER
    binaries:
      - path: /usr/bin/python3*
      - path: /usr/local/bin/python3*
      - path: /opt/app-root/bin/python3*
