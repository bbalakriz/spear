version: 1
filesystem_policy:
  include_workdir: true
  read_only:
    - /usr
    - /lib
    - /lib64
    - /opt
    - /etc
    - /proc
    - /dev/urandom
  read_write:
    - /sandbox
    - /tmp
    - /dev/null
landlock:
  compatibility: best_effort
network_policies:
  cluster_auth:
    name: cluster-auth
    endpoints:
      # the sandbox supervisor's own token_grant provider needs to reach
      # keycloak to mint this sandbox's workload access token. goes
      # straight to keycloak's own real https route now, confirmed live
      # openshell 0.0.116 does tls to the real backend automatically for
      # a plain rest endpoint on port 443, no separate protocol literal
      # needed. an earlier pass here went through a plaintext relay on
      # the wrong assumption that the rest proxy could not do tls at all
      - host: sso.apps.cluster-rf7lv.dyn.redhatworkshops.io
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-write
        # no allowed_ips here on purpose, this is the one endpoint in this
        # policy that is not an in cluster service. confirmed live the
        # wildcard apps route resolves to 10.10.10.101, outside both the
        # cluster and service network cidrs used everywhere else below, so
        # restricting to those two cidrs would wrongly block this one
    binaries:
      - path: /usr/bin/python3*
      - path: /usr/local/bin/python3*
      - path: /opt/app-root/bin/python3*
  cluster_ogx:
    name: cluster-ogx
    endpoints:
      # the generation model call, glm-53-flash's own real tool calling
      # confirmed live before this policy was written, not assumed.
      # routed through spear-shield-ogx-relay, not ogx's own service
      # directly, same NetworkPolicy constraint spear-retrieval-agent's
      # own policy hit live, see ../ogx-relay.yaml's own comment
      - host: spear-shield-ogx-relay.rag-phase1.svc.cluster.local
        port: 8080
        protocol: rest
        enforcement: enforce
        access: read-write
        allowed_ips:
          - CLUSTER_NETWORK_CIDR_PLACEHOLDER
          - SERVICE_NETWORK_CIDR_PLACEHOLDER
    binaries:
      - path: /usr/bin/python3*
      - path: /usr/local/bin/python3*
      - path: /opt/app-root/bin/python3*
  cluster_retrieval:
    name: cluster-retrieval
    endpoints:
      # routed through this project's own second, independent openshell
      # release, see manifests/50-spear-shield-agents/11-a2a-gateway.yaml
      - host: spear-retrieval-a2a-gateway.spear-shield-agents.svc.cluster.local
        port: 80
        protocol: rest
        enforcement: enforce
        access: read-write
        allowed_ips:
          - CLUSTER_NETWORK_CIDR_PLACEHOLDER
          - SERVICE_NETWORK_CIDR_PLACEHOLDER
    binaries:
      - path: /usr/bin/python3*
      - path: /usr/local/bin/python3*
      - path: /opt/app-root/bin/python3*
