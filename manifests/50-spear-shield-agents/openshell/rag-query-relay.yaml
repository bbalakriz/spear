# unsandboxed http wrapper around rag_query.py's own abac_filtered_search,
# deployed inside rag-phase1 itself, same reasoning as ogx-relay.yaml,
# a different constraint: this cluster's openshell build does not
# advertise transparent tcp support, so the sandboxed retrieval agent
# cannot open a raw postgres connection to pgvector at all, see
# agents/spear-retrieval-agent/rag_query_server.py's own module
# docstring for the exact error message that proved this live.
#
# built from the same image as spear-coordinator-agent's own sibling,
# spear-retrieval-agent, already pushed to spear-shield-agents' internal
# registry, just run with a different command here: a container image
# is not sandbox specific, only the openshell sandbox create invocation
# that uses it is.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spear-shield-rag-query-relay
  namespace: rag-phase1
  labels:
    app.kubernetes.io/part-of: spear-shield-agents
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spear-shield-rag-query-relay
  template:
    metadata:
      labels:
        app: spear-shield-rag-query-relay
    spec:
      containers:
        - name: relay
          image: image-registry.openshift-image-registry.svc:5000/spear-shield-agents/spear-retrieval-agent:latest
          command: ["python3", "/sandbox/rag_query_server.py"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: OGX_BASE_URL
              value: http://spear-shield-ogx-relay.rag-phase1.svc.cluster.local:8080
            - name: PGVECTOR_HOST
              value: pgvector.rag-phase1.svc.cluster.local
            - name: PGVECTOR_DB_PORT
              value: "5432"
            - name: PGVECTOR_DB
              value: ragdb
            - name: PGVECTOR_USER
              valueFrom:
                secretKeyRef:
                  name: pgvector-creds
                  key: user
            - name: PGVECTOR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pgvector-creds
                  key: password
---
apiVersion: v1
kind: Service
metadata:
  name: spear-shield-rag-query-relay
  namespace: rag-phase1
  labels:
    app.kubernetes.io/part-of: spear-shield-agents
spec:
  selector:
    app: spear-shield-rag-query-relay
  ports:
    - name: http
      port: 8080
      targetPort: 8080
