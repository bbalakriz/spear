# spear-agents realm import (one time job; later edits need admin API). shared keycloak server
# SPIFFE idp and clients-federated flow are not in KeycloakRealmImport; scripts/09-install-worktracker-and-agents.sh ensures them
# sso realm demo users and bearer client id must match spear-worktracker/spear-openproject-mcp for mcp gateway RBAC
apiVersion: k8s.keycloak.org/v2beta1
kind: KeycloakRealmImport
metadata:
  name: spear-agents-realm
  namespace: keycloak
  labels:
    app.kubernetes.io/part-of: spear-agents
spec:
  keycloakCRName: keycloak
  realm:
    realm: spear-agents
    enabled: true
    sslRequired: external
    registrationAllowed: false
    loginWithEmailAllowed: false
    duplicateEmailsAllowed: false
    resetPasswordAllowed: false
    editUsernameAllowed: false
    attributes:
      userProfileConfig: '{"attributes":[{"name":"username","permissions":{"view":["admin","user"],"edit":["admin","user"]}},{"name":"email","required":{"roles":["user"]},"permissions":{"view":["admin","user"],"edit":["admin","user"]}},{"name":"firstName","required":{"roles":["user"]},"permissions":{"view":["admin","user"],"edit":["admin","user"]}},{"name":"lastName","required":{"roles":["user"]},"permissions":{"view":["admin","user"],"edit":["admin","user"]}}],"unmanagedAttributePolicy":"ENABLED"}'
    roles:
      client:
        spear-worktracker/spear-openproject-mcp:
          - name: tool:search_work_packages
          - name: tool:update_work_package
    clientScopeMappings:
      spear-worktracker/spear-openproject-mcp:
        - client: spear-coordinator
          roles:
            - tool:search_work_packages
            - tool:update_work_package
    clients:
      - clientId: spear-coordinator
        name: spear-coordinator
        enabled: true
        protocol: openid-connect
        publicClient: false
        secret: f505e68dafacd8e440db4fef433366974f49079da21d8f28
        serviceAccountsEnabled: true
        standardFlowEnabled: false
        directAccessGrantsEnabled: true
        clientAuthenticatorType: client-secret
        # without these, clearance_level/dept/team never reach the token this
        # client mints, and section 3's abac filter has nothing to read
        protocolMappers:
          - name: clearance_level
            protocol: openid-connect
            protocolMapper: oidc-usermodel-attribute-mapper
            config:
              user.attribute: clearance_level
              claim.name: clearance_level
              jsonType.label: String
              id.token.claim: "true"
              access.token.claim: "true"
              userinfo.token.claim: "true"
              multivalued: "false"
              aggregate.attrs: "false"
          - name: dept
            protocol: openid-connect
            protocolMapper: oidc-usermodel-attribute-mapper
            config:
              user.attribute: dept
              claim.name: dept
              jsonType.label: String
              id.token.claim: "true"
              access.token.claim: "true"
              userinfo.token.claim: "true"
              multivalued: "false"
              aggregate.attrs: "false"
          - name: team
            protocol: openid-connect
            protocolMapper: oidc-usermodel-attribute-mapper
            config:
              user.attribute: team
              claim.name: team
              jsonType.label: String
              id.token.claim: "true"
              access.token.claim: "true"
              userinfo.token.claim: "true"
              multivalued: "false"
              aggregate.attrs: "false"
      # federated-jwt for openshell token_grant; sub must match coordinator spiffe id
      # trust domain is ztwim's agent-pack.internal (see docs/decisions.md D4)
      - clientId: spear-coordinator-workload
        name: spear-coordinator-workload
        enabled: true
        protocol: openid-connect
        publicClient: false
        serviceAccountsEnabled: true
        standardFlowEnabled: false
        directAccessGrantsEnabled: false
        clientAuthenticatorType: federated-jwt
        attributes:
          jwt.credential.issuer: spire
          # the live, observed agents.x-k8s.io/sandbox-name-hash label
          # value for sandbox name "spear-coordinator", not the sandbox
          # name itself:
          # own --label app=... flag never becomes a real kubernetes pod
          # label at all, see manifests/spear-agents/06-cluster-spiffeid.yaml's
          # own comment for the full story, this hash is what the
          # clusterSPIFFEID's own podSelector and spiffeIDTemplate
          # actually key on
          jwt.credential.sub: spiffe://agent-pack.internal/ns/spear-agents/sandbox/abf32a96
      - clientId: spear-retrieval
        name: spear-retrieval
        enabled: true
        protocol: openid-connect
        publicClient: false
        secret: 29fc42bb9022bb2aeda49dd63149efd54d4852c63c002c43
        serviceAccountsEnabled: true
        standardFlowEnabled: false
        directAccessGrantsEnabled: false
        clientAuthenticatorType: client-secret
      # role namespace only, id must match the broker's x-mcp-servername
      # value, which is the real MCPServer cr's own namespace/name, not
      # wherever this project's own agents happen to live
      - clientId: spear-worktracker/spear-openproject-mcp
        name: spear-openproject-mcp tool roles
        enabled: true
        bearerOnly: true
        publicClient: false
        serviceAccountsEnabled: false
        protocol: openid-connect
    users:
      - username: balakrishnan.b
        firstName: Balakrishnan
        lastName: B
        email: balakrishnan.b@spear-shield.demo
        emailVerified: true
        enabled: true
        attributes:
          clearance_level:
            - general
          dept:
            - engineering
          team:
            - data-eng
        credentials:
          - type: password
            value: ConsoleTest#2026
            temporary: false
        clientRoles:
          spear-worktracker/spear-openproject-mcp:
            - tool:search_work_packages
      - username: siddhartha.de
        firstName: Siddhartha
        lastName: De
        email: siddhartha.de@spear-shield.demo
        emailVerified: true
        enabled: true
        attributes:
          clearance_level:
            - restricted
          dept:
            - data-governance
        credentials:
          - type: password
            value: ConsoleTest#2026
            temporary: false
        clientRoles:
          spear-worktracker/spear-openproject-mcp:
            - tool:search_work_packages
            - tool:update_work_package
