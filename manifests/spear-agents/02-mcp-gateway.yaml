# istio mcp gateway and routes for tool servers
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: spear-mcp-gateway
  namespace: spear-agents
spec:
  gatewayClassName: istio
  listeners:
    - name: mcp
      hostname: MCP_PUBLIC_HOST_PLACEHOLDER
      port: 8080
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
    - name: mcps
      hostname: "*.mcp.local"
      port: 8080
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
---
apiVersion: mcp.kuadrant.io/v1alpha1
kind: MCPGatewayExtension
metadata:
  name: spear-mcp
  namespace: spear-agents
spec:
  httpRouteManagement: Enabled
  oauthProtectedResource:
    authorizationServers:
      - ISSUER_URL_PLACEHOLDER
    resource: https://MCP_PUBLIC_HOST_PLACEHOLDER/mcp
    scopesSupported:
      - openid
      - mcp:tools
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: spear-mcp-gateway
    namespace: spear-agents
    sectionName: mcp
---
# kuadrant AuthPolicy for mcp gateway (spear-agents realm, not agent-pack)
apiVersion: kuadrant.io/v1
kind: AuthPolicy
metadata:
  name: spear-mcp-gateway-auth
  namespace: spear-agents
  labels:
    app.kubernetes.io/part-of: spear-agents
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: spear-mcp-gateway
    sectionName: mcp
  defaults:
    when:
      - predicate: |
          !request.path.contains('/.well-known/oauth-protected-resource')
    rules:
      authentication:
        spear-shield-keycloak:
          jwt:
            issuerUrl: ISSUER_URL_PLACEHOLDER
      response:
        unauthenticated:
          code: 401
          headers:
            WWW-Authenticate:
              value: Bearer resource_metadata=https://MCP_PUBLIC_HOST_PLACEHOLDER/.well-known/oauth-protected-resource/mcp
          body:
            value: '{"error":"unauthorized","message":"mcp gateway requires a bearer token"}'
---
apiVersion: kuadrant.io/v1
kind: AuthPolicy
metadata:
  name: spear-mcp-gateway-tools-auth
  namespace: spear-agents
  labels:
    app.kubernetes.io/part-of: spear-agents
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: spear-mcp-gateway
    sectionName: mcps
  rules:
    authentication:
      spear-shield-keycloak:
        jwt:
          issuerUrl: ISSUER_URL_PLACEHOLDER
    # tool RBAC: resource_access[x-mcp-servername] must include tool:<x-mcp-toolname>
    authorization:
      tool-access-check:
        when:
          - predicate: "request.headers.exists(h, h == 'x-mcp-toolname')"
          - predicate: "request.headers['x-mcp-method'] == 'tools/call'"
        patternMatching:
          patterns:
            - predicate: |
                ('tool:' + request.headers['x-mcp-toolname']) in (
                  has(auth.identity.resource_access) &&
                  auth.identity.resource_access.exists(p, p == request.headers['x-mcp-servername'])
                    ? auth.identity.resource_access[request.headers['x-mcp-servername']].roles
                    : []
                )
    response:
      unauthenticated:
        code: 401
        body:
          value: '{"error":"unauthorized","message":"mcp backend hop requires a bearer token"}'
      unauthorized:
        body:
          value: |
            {"jsonrpc":"2.0","error":{"code":-32600,"message":"forbidden: insufficient permissions for this tool"}}
