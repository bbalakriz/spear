# the mcp gateway plus its own authpolicies, every mcp tool call
# (worktracker, future tool servers) flows through here. the a2a gateway
# each agent talks over is a separate object entirely, 07-a2a-gateway.yaml,
# own listeners, own httproutes, not shared with this one. kept gateway
# and authpolicy together in one file now, same inline shape the a2a
# gateway already uses, instead of a gateway file and a separate
# auth-policies file that only ever got applied back to back anyway.
#
# same two listener shape as the reference's own
# manifests/10-agent-pack/02-mcp-gateway.yaml, own instance, own
# namespace, agent-pack's gateway is not touched or shared, section 2.
#
# NAMESPACE_MIGRATION_PLAN.md: allowedRoutes.namespaces.from changed
# from Same to All on both listeners. spear-openproject-mcp's own
# HTTPRoute now lives in spear-worktracker, a different namespace than
# this gateway, Same would silently reject that cross namespace
# parentRef, re verify live once applied, not assumed
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: spear-mcp-gateway
  namespace: spear-agents
spec:
  gatewayClassName: istio
  listeners:
    - name: mcp
      hostname: MCP_PUBLIC_HOST_PLACEHOLDER
      port: 8080
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
    - name: mcps
      hostname: "*.mcp.local"
      port: 8080
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
---
apiVersion: mcp.kuadrant.io/v1alpha1
kind: MCPGatewayExtension
metadata:
  name: spear-mcp
  namespace: spear-agents
spec:
  httpRouteManagement: Enabled
  oauthProtectedResource:
    authorizationServers:
      - ISSUER_URL_PLACEHOLDER
    resource: https://MCP_PUBLIC_HOST_PLACEHOLDER/mcp
    scopesSupported:
      - openid
      - mcp:tools
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: spear-mcp-gateway
    namespace: spear-agents
    sectionName: mcp
---
# same two authpolicy shape as the reference's own
# manifests/20-security/03-auth-policies.yaml, rebuilt against
# spear-mcp-gateway and the spear-agents realm, own instance,
# nothing shared with agent-pack, section 2.
apiVersion: kuadrant.io/v1
kind: AuthPolicy
metadata:
  name: spear-mcp-gateway-auth
  namespace: spear-agents
  labels:
    app.kubernetes.io/part-of: spear-agents
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: spear-mcp-gateway
    sectionName: mcp
  defaults:
    when:
      - predicate: |
          !request.path.contains('/.well-known/oauth-protected-resource')
    rules:
      authentication:
        spear-shield-keycloak:
          jwt:
            issuerUrl: ISSUER_URL_PLACEHOLDER
      response:
        unauthenticated:
          code: 401
          headers:
            WWW-Authenticate:
              value: Bearer resource_metadata=https://MCP_PUBLIC_HOST_PLACEHOLDER/.well-known/oauth-protected-resource/mcp
          body:
            value: '{"error":"unauthorized","message":"mcp gateway requires a bearer token"}'
---
apiVersion: kuadrant.io/v1
kind: AuthPolicy
metadata:
  name: spear-mcp-gateway-tools-auth
  namespace: spear-agents
  labels:
    app.kubernetes.io/part-of: spear-agents
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: spear-mcp-gateway
    sectionName: mcps
  rules:
    authentication:
      spear-shield-keycloak:
        jwt:
          issuerUrl: ISSUER_URL_PLACEHOLDER
    # tool level rbac, same mcp-gateway-guide pattern the reference uses:
    # the caller's resource_access claim, keyed by the mcp server's
    # registration namespace/name, must contain "tool:<name>" for the
    # tool named in x-mcp-toolname. matches the two real roles already
    # on the spear-agents realm's spear-openproject-mcp resource
    # client, section 6: tool:search_work_packages, tool:update_work_package
    authorization:
      tool-access-check:
        when:
          - predicate: "request.headers.exists(h, h == 'x-mcp-toolname')"
          - predicate: "request.headers['x-mcp-method'] == 'tools/call'"
        patternMatching:
          patterns:
            - predicate: |
                ('tool:' + request.headers['x-mcp-toolname']) in (
                  has(auth.identity.resource_access) &&
                  auth.identity.resource_access.exists(p, p == request.headers['x-mcp-servername'])
                    ? auth.identity.resource_access[request.headers['x-mcp-servername']].roles
                    : []
                )
    response:
      unauthenticated:
        code: 401
        body:
          value: '{"error":"unauthorized","message":"mcp backend hop requires a bearer token"}'
      unauthorized:
        body:
          value: |
            {"jsonrpc":"2.0","error":{"code":-32600,"message":"forbidden: insufficient permissions for this tool"}}
