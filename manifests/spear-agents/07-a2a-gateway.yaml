# a2a gateway for coordinator and retrieval agents (separate from 02-mcp-gateway.yaml)
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: spear-a2a-gateway
  namespace: spear-agents
  labels:
    app.kubernetes.io/part-of: spear-agents
spec:
  # same gatewayClassName as 02-mcp-gateway.yaml's own mcp gateway
  gatewayClassName: istio
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: v1
kind: Service
metadata:
  name: spear-retrieval-a2a-gateway
  namespace: spear-agents
  labels:
    app.kubernetes.io/part-of: spear-agents
spec:
  selector:
    gateway.networking.k8s.io/gateway-name: spear-a2a-gateway
  ports:
    - name: http
      port: 80
      targetPort: 80
---
# coordinator inbound a2a route; host must match openshell expose (coordinator-http)
apiVersion: v1
kind: Service
metadata:
  name: spear-coordinator-a2a-gateway
  namespace: spear-agents
  labels:
    app.kubernetes.io/part-of: spear-agents
spec:
  selector:
    gateway.networking.k8s.io/gateway-name: spear-a2a-gateway
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: spear-coordinator-a2a
  namespace: spear-agents
  labels:
    app.kubernetes.io/part-of: spear-agents
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: spear-a2a-gateway
      namespace: spear-agents
      sectionName: http
  hostnames:
    - spear-coordinator-a2a-gateway.spear-agents.svc.cluster.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        # host must match the exact string openshell service expose
        # prints
        # openshell.localhost, not default--spear-coordinator--a2a, the
        # service's own real name wins here, not a copy paste guess
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: Host
                value: default--spear-coordinator--coordinator-http.openshell.localhost
      backendRefs:
        - name: spear-openshell-a2a-backend
          port: 8080
---
# ExternalName to shared openshell release in openshift namespace (not a second helm release)
apiVersion: v1
kind: Service
metadata:
  name: spear-openshell-a2a-backend
  namespace: spear-agents
  labels:
    app.kubernetes.io/part-of: spear-agents
spec:
  type: ExternalName
  externalName: openshell.openshell.svc.cluster.local
  ports:
    - name: http
      port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: spear-retrieval-a2a
  namespace: spear-agents
  labels:
    app.kubernetes.io/part-of: spear-agents
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: spear-a2a-gateway
      namespace: spear-agents
      sectionName: http
  hostnames:
    - spear-retrieval-a2a-gateway.spear-agents.svc.cluster.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        # host must match the exact string openshell service expose
        # prints (workspace--sandbox--service.openshell.localhost), the
        # retrieval agent sandbox is named spear-retrieval (19 char
        # sandbox name limit
        # "a2a" under workspace "default"
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: Host
                value: default--spear-retrieval--a2a.openshell.localhost
      backendRefs:
        - name: spear-openshell-a2a-backend
          port: 8080
---
apiVersion: kuadrant.io/v1
kind: AuthPolicy
metadata:
  name: spear-retrieval-a2a-auth
  namespace: spear-agents
  labels:
    app.kubernetes.io/part-of: spear-agents
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: spear-a2a-gateway
    sectionName: http
  # authorino accepts the request if either issuer validates: a keycloak
  # jwt for spear-coordinator-workload's client credentials grant, or a
  # spire issued jwt-svid asserted from the coordinator's token_grant provider
  rules:
    authentication:
      spear-shield-keycloak:
        jwt:
          issuerUrl: ISSUER_URL_PLACEHOLDER
      spear-shield-spire:
        jwt:
          issuerUrl: SPIRE_OIDC_ROUTE_PLACEHOLDER
    response:
      unauthenticated:
        code: 401
        headers:
          WWW-Authenticate:
            value: Bearer
        body:
          value: '{"error":"unauthorized","message":"retrieval agent a2a route requires a bearer token"}'
