# openshell CLI image build for deploy job
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: openshell-cli
  namespace: spear-agents
  labels:
    app: openshell-cli
spec: {}
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: openshell-cli
  namespace: spear-agents
  labels:
    app: openshell-cli
spec:
  source:
    type: Binary
    binary: {}
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Containerfile.openshell-cli
  output:
    to:
      kind: ImageStreamTag
      name: openshell-cli:latest
  triggers: []
