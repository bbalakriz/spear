# openshell provider for coordinator a2a token grant via keycloak
id: coordinator-a2a-token-grant
display_name: coordinator a2a via spiffe token grant
description: spiffe jwt-svid client assertion to keycloak for retrieval agent a2a
category: agent
credentials:
  - name: access_token
    description: keycloak access token minted via spiffe jwt client assertion
    required: false
    auth_style: bearer
    header_name: Authorization
    token_grant:
      grant_type: client_credentials
      token_endpoint: ISSUER_URL_PLACEHOLDER/protocol/openid-connect/token
      jwt_svid_audience: ISSUER_URL_PLACEHOLDER
      client_assertion_type: urn:ietf:params:oauth:client-assertion-type:jwt-spiffe
      cache_ttl_seconds: 240
endpoints:
  - host: spear-retrieval-a2a-gateway.spear-agents.svc.cluster.local
    port: 80
    protocol: rest
    tls: none
    access: read-write
    enforcement: enforce
    allowed_ips:
      - CLUSTER_NETWORK_CIDR_PLACEHOLDER
      - SERVICE_NETWORK_CIDR_PLACEHOLDER
binaries:
  - /usr/bin/python3*
  - /usr/local/bin/python3*
  - /opt/app-root/bin/python3*
