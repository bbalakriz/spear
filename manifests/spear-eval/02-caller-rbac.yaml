# evalhub caller SA for scripts/11-submit-evalhub-jobs.sh (long lived token via oc create token)
# mlflow experiments grant: evalhub forwards caller token; mlflow SAR uses x-tenant namespace (spear-eval). see docs/decisions.md D10
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spear-eval-caller
  namespace: spear-eval
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: evalhub-evaluator
  namespace: spear-eval
rules:
  - apiGroups: ["trustyai.opendatahub.io"]
    resources: ["evaluations", "collections", "providers"]
    verbs: ["get", "list", "create", "update", "delete"]
  - apiGroups: [mlflow.kubeflow.org]
    resources: [experiments]
    verbs: [get, list, create, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spear-eval-caller
  namespace: spear-eval
subjects:
  - kind: ServiceAccount
    name: spear-eval-caller
    namespace: spear-eval
roleRef:
  kind: Role
  name: evalhub-evaluator
  apiGroup: rbac.authorization.k8s.io
