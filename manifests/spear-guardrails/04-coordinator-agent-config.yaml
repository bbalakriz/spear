# nemo guardrails config for spear-coordinator-agent's own llm call,
# PHASE2_PLAN.md section 7's open item: the work tracker tool response
# already had a real check (work-tracker-config), the coordinator's own
# reasoning call to ogx never did. selected per request with
# guardrails.config_id: coordinator-agent-config, same mechanism as the
# other two configs in this file set.
#
# real models block this time, the documented rhoai 3.4 pattern: the
# coordinator points OGX_BASE_URL straight at this guardrails route's
# own /v1/chat/completions instead of at ogx directly, guardrails runs
# these input/output rails then forwards to the real model itself.
# NAMESPACE_MIGRATION_PLAN.md: ogx now lives in a different namespace,
# spear-inference, not alongside guardrails anymore, so this leg is a
# real cross namespace call now, re verify live that spear-inference's
# own network policy still allows it, see manifests/spear-inference/01-ogxserver.yaml
#
# base_url, not openai_api_base, confirmed live against the real
# version installed on this cluster: the doc's own example field name
# got a real, specific rejection, "config uses 0.21-style langchain
# conventions... rename openai_api_base to base_url", a genuine doc vs
# installed version mismatch, not a typo on this file's part
#
# same regex injection patterns as work-tracker-config, this is the same
# underlying nightmare (an untrusted text blob trying to steer the
# agent's own behavior), just checked on the real end user's own prompt
# going in and the model's own synthesized answer coming out, instead of
# a work tracker tool response. same entity list minus PERSON for the
# same reason recorded there, a legitimate answer can and does carry
# real people's names
apiVersion: v1
kind: ConfigMap
metadata:
  name: coordinator-agent-config
  namespace: spear-guardrails
data:
  config.yaml: |
    passthrough: true
    models:
      - type: main
        engine: openai
        parameters:
          base_url: "http://rag-phase1-ogx-service.spear-inference.svc.cluster.local:8321/v1"
          model_name: "openai/publishers/prelude-maas/models/glm-53-flash"
    rails:
      config:
        sensitive_data_detection:
          input:
            entities:
              - EMAIL_ADDRESS
              - CREDIT_CARD
              - US_SSN
        regex_detection:
          input:
            patterns:
              - "ignore\\s+(all\\s+)?previous\\s+instructions?"
              - "system\\s+override"
              - "you\\s+(now\\s+)?have\\s+elevated\\s+access"
              - "disregard\\s+(all\\s+)?(prior|previous)\\s+(rules|restrictions|instructions)"
              - "classify\\s+all\\s+data\\s+as\\s+public"
              - "share\\s+(the\\s+)?full\\s+(customer\\s+)?database"
              - "\\[\\s*system\\s*[:\\]]"
            case_insensitive: true
      input:
        flows:
          - detect sensitive data on input
          - regex check input
  rails.co: |
    # built in rails only, same shape as work-tracker-config
