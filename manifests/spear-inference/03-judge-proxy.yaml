# sidecar judge proxy for ragas structured output (disable thinking on gemma judge)
apiVersion: v1
kind: ConfigMap
metadata:
  name: spear-judge-proxy-script
  namespace: spear-inference
data:
  proxy.py: |
    # stdlib only on purpose, no pip install at pod startup to depend on
    # see the header comment in 03-judge-proxy.yaml for the full story
    import json
    import urllib.request
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    UPSTREAM = "http://spear-ogx-service.spear-inference.svc.cluster.local:8321"


    class ProxyHandler(BaseHTTPRequestHandler):
        def _forward(self):
            length = int(self.headers.get("Content-Length", 0))
            body = self.rfile.read(length) if length else b""

            if self.command == "POST" and self.path == "/v1/chat/completions" and body:
                try:
                    payload = json.loads(body)
                except ValueError:
                    payload = None
                if isinstance(payload, dict):
                    response_format = payload.get("response_format") or {}
                    if response_format.get("type") == "json_schema" and "chat_template_kwargs" not in payload:
                        payload["chat_template_kwargs"] = {"enable_thinking": False}
                        body = json.dumps(payload).encode()

            headers = {k: v for k, v in self.headers.items() if k.lower() not in ("host", "content-length")}
            headers["Content-Length"] = str(len(body))
            req = urllib.request.Request(UPSTREAM + self.path, data=body or None, headers=headers, method=self.command)
            try:
                with urllib.request.urlopen(req, timeout=1200) as resp:
                    self.send_response(resp.status)
                    for k, v in resp.headers.items():
                        if k.lower() not in ("transfer-encoding", "connection"):
                            self.send_header(k, v)
                    self.end_headers()
                    self.wfile.write(resp.read())
            except urllib.error.HTTPError as exc:
                self.send_response(exc.code)
                self.send_header("Content-Type", "application/json")
                self.end_headers()
                self.wfile.write(exc.read())

        def do_GET(self):
            self._forward()

        def do_POST(self):
            self._forward()

        def log_message(self, fmt, *args):
            print("%s - %s" % (self.address_string(), fmt % args))


    if __name__ == "__main__":
        ThreadingHTTPServer(("0.0.0.0", 8080), ProxyHandler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spear-judge-proxy
  namespace: spear-inference
  labels:
    app: spear-judge-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spear-judge-proxy
  template:
    metadata:
      labels:
        app: spear-judge-proxy
    spec:
      containers:
        - name: proxy
          image: registry.access.redhat.com/ubi9/python-312:latest
          command: ["python3", "/app/proxy.py"]
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
          volumeMounts:
            - name: script
              mountPath: /app/proxy.py
              subPath: proxy.py
      volumes:
        - name: script
          configMap:
            name: spear-judge-proxy-script
---
apiVersion: v1
kind: Service
metadata:
  name: spear-judge-proxy
  namespace: spear-inference
spec:
  selector:
    app: spear-judge-proxy
  ports:
    - port: 8321
      targetPort: 8080
