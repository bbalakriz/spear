# mlflow workspace RBAC in spear-pipelines
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spear-pipelines-mlflow-caller
  namespace: spear-pipelines
rules:
  - apiGroups: [mlflow.kubeflow.org]
    resources: [experiments]
    verbs: [get, list, create, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spear-pipelines-mlflow-caller
  namespace: spear-pipelines
subjects:
  - kind: ServiceAccount
    name: pipeline-runner-spear-dspa
    namespace: spear-pipelines
roleRef:
  kind: Role
  name: spear-pipelines-mlflow-caller
  apiGroup: rbac.authorization.k8s.io
