# the mlflow instance every ingestion pipeline run logs its report artifact
# to (architecture.html's phase 3 mlflow, reused here rather than building a
# second audit backbone).
#
# confirmed live 2026-09-25, contrary to what the CRD's namespaced scope
# suggests: this operator only ever manages a single, cluster wide instance
# named exactly "mlflow" (apply with any other name and it is rejected,
# "MLflow resource name must be 'mlflow'"), and its actual workloads
# (migration job, server deployment) always land in
# redhat-ods-applications regardless of what namespace the cr itself is
# created in, matching the "OpenShift Self Managed Services" section the
# mlflowoperator cr's own spec.sectionTitle places it under, one shared
# instance for the whole platform, the same pattern as the pre existing
# odh-dashboard-mlflow-ui service. so unlike everything else this project
# owns, this cr and its secrets live in redhat-ods-applications on
# purpose, not any of this project's own namespaces, scripts/04-install-pipelines.sh
# checks before creating exactly like scripts/01-install-namespaces.sh
# already does for the shared odh-dashboard-config flags.
#
# backendStoreUriFrom points at mlflow-backend-conn (generated once by
# scripts/04-install-pipelines.sh, a full postgres dsn including the password,
# kept out of this spec on purpose since spec.backendStoreUri would put the
# password in plain sight on `oc get mlflow -o yaml`), pointed at a
# database on spear-data's own pgvector instance since no shared postgres
# exists on this cluster. artifacts land in this project's own
# dsp-pipeline-artifacts minio bucket under an mlflow/ prefix, credentials
# synced into redhat-ods-applications as mlflow-s3-creds since the pod
# reading them runs there, not in any of this project's own namespaces.
#
# no route/httproute authored here: the mlflowoperator's spec.gatewayName
# (data-science-gateway, confirmed live) means the operator exposes this
# itself, readable off status.url once ready.
#
# workspaceLabelSelector: confirmed live 2026-09-25 that this build uses a
# genuinely custom multi tenant layer on top of upstream mlflow
# (KubernetesWorkspaceProvider, server-info reports workspaces_enabled:
# true), every api call 400s with "Workspace context is required" until a
# namespace matches this selector and is passed as the workspace.
#
# NAMESPACE_MIGRATION_PLAN.md: the label key itself is renamed from
# rag-phase1.io/mlflow-workspace to spear.io/mlflow-workspace, since
# rag-phase1 is retired entirely by this migration, and applied to
# spear-pipelines instead, the one namespace that actually calls mlflow
# today. re verify live this operator reloads the selector on a plain
# cr update rather than needing a restart, not assumed
apiVersion: mlflow.opendatahub.io/v1
kind: MLflow
metadata:
  name: mlflow
  namespace: redhat-ods-applications
spec:
  # off by default on this operator, confirmed live 2026-10-07 via
  # spec.serveArtifacts on the running cr, even though defaultArtifactRoot
  # below already points at a real, fully wired s3 backend. every evalhub
  # provider's own result save path (ragas, ibm-clear, same shared sdk
  # method, callbacks.mlflow.save) tries to upload real artifacts
  # (clear_results.html among them) through this same proxy endpoint and
  # gets a flat 503 until this is true, confirmed live against the real
  # error text before flipping this
  serveArtifacts: true
  # without this, the operator defaults the proxy's own write target to
  # file:///mlflow/artifacts, confirmed live there is no volume mounted at
  # that path at all on the real pod, every proxied upload would land on
  # ephemeral container storage and vanish on the next restart. same
  # bucket defaultArtifactRoot already uses below, same s3 creds already
  # wired through spec.env, no new storage needed, the crd's own field doc
  # says exactly that for an s3 destination
  artifactsDestination: s3://dsp-pipeline-artifacts/mlflow
  workspaceLabelSelector:
    matchLabels:
      spear.io/mlflow-workspace: "true"
  backendStoreUriFrom:
    name: mlflow-backend-conn
    key: uri
  defaultArtifactRoot: s3://dsp-pipeline-artifacts/mlflow
  env:
    - name: MLFLOW_S3_ENDPOINT_URL
      value: http://minio.minio.svc.cluster.local:9000
    - name: AWS_DEFAULT_REGION
      value: us-east-1
    - name: AWS_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef:
          name: mlflow-s3-creds
          key: accesskey
    - name: AWS_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: mlflow-s3-creds
          key: secretkey
