# externalized, gateway side request/response guardrail enforcement,
# shared by every mcp server fronted by spear-shield-gateway, without
# touching any of their own code, see
# mcp-servers/spear-shield-mcp-guard-proxy/server.py for why this exists
# instead of wiring nemo-request-guard/nemo-response-guard as a second
# envoy ext_proc filter (a real, open upstream bug, confirmed live this
# same investigation).
#
# one deployment for all mcp servers, not one per server: the proxy
# derives each request's real backend from mcp-gateway's own
# x-mcp-servername header, confirmed live, no per server env var needed.
# onboarding a new mcp server is a one line httproute backendref change
# to this same service, nothing else, no redeploy of this proxy.
#
# plain Deployment + Service on purpose, not an MCPServer CR: this is a
# transparent proxy, not an mcp tool server in its own right, it never
# needs a userSpecificList or its own MCPServerRegistration, each real
# server's existing HTTPRoute/MCPServerRegistration/MCPVirtualServer
# (e.g. manifests/spear-worktracker/04-openproject-mcp.yaml) is reused
# unchanged, only that httproute's backendref moves from the real
# backend to this proxy.
#
# NAMESPACE_MIGRATION_PLAN.md: spear-openproject-mcp's own HTTPRoute now
# lives in a different namespace (spear-worktracker), so its backendref
# to this Service is cross namespace, see
# manifests/spear-shield-agents/05-mcp-guard-proxy-referencegrant.yaml
# for the ReferenceGrant that permits it
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spear-shield-mcp-guard-proxy
  namespace: spear-shield-agents
  labels:
    app: spear-shield-mcp-guard-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spear-shield-mcp-guard-proxy
  template:
    metadata:
      labels:
        app: spear-shield-mcp-guard-proxy
    spec:
      containers:
        - name: guard-proxy
          image: image-registry.openshift-image-registry.svc:5000/openshift/python:3.12-ubi9
          command: ["python3", "/mcp/server.py"]
          ports:
            - containerPort: 8000
          env:
            # no UPSTREAM_URL here on purpose, an earlier pass through
            # this exact bug set it to a single hardcoded backend to get
            # mcp-gateway's own internal discovery connection to
            # resolve, believing that connection carried no server
            # identity at all. wrong, and would have silently broken
            # the moment a second mcp server shared this one proxy
            # deployment, a single fixed value cannot tell two servers'
            # own discovery connections apart. the real fix lives in
            # server.py's own resolve_upstream: that connection does
            # carry real server identity, a gateway-server-id header,
            # confirmed live by temporarily logging every header on a
            # request missing x-mcp-servername. UPSTREAM_URL stays
            # supported in server.py only as a genuinely last resort,
            # for a direct test that bypasses mcp-gateway entirely and
            # so carries neither header, not needed for real operation
            - name: GUARDRAILS_ROUTE
              value: GUARDRAILS_ROUTE_PLACEHOLDER
            - name: GUARDRAILS_CONFIG_ID
              value: work-tracker-config
          volumeMounts:
            - name: code
              mountPath: /mcp
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: code
          configMap:
            name: spear-shield-mcp-guard-proxy-code
---
apiVersion: v1
kind: Service
metadata:
  name: spear-shield-mcp-guard-proxy
  namespace: spear-shield-agents
  labels:
    app: spear-shield-mcp-guard-proxy
spec:
  selector:
    app: spear-shield-mcp-guard-proxy
  ports:
    - port: 8000
      targetPort: 8000
