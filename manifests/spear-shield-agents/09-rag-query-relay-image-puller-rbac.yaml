# rag-query-relay (manifests/spear-data/02-rag-query-relay.yaml) runs the
# exact same image as spear-retrieval-agent, but its deployment lives in
# spear-data, not this namespace. openshift's internal registry refuses
# any cross namespace image pull without an explicit grant, found live
# during the 2026-10-04 rebuild as an ErrImagePull on that deployment,
# see NAMESPACE_MIGRATION_PLAN.md. this never came up before the
# migration split rag-query-relay out into its own namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spear-data-image-puller
  namespace: spear-shield-agents
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:image-puller
subjects:
  - kind: ServiceAccount
    name: default
    namespace: spear-data
