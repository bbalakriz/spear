# four narrow, read only grants so spear-console-backend's own
# demo_workload_identity can name the real spire to keycloak pathway live,
# off the real cluster, at call time, instead of typing the mechanism into
# its own source. three of the four pin resourceNames, same least
# privilege shape as 08-console-backend-rbac.yaml, one get per resource,
# nothing wider. the fourth, spire-agent's own pod and pod log, cannot
# pin a resourceName at all: the spire-agent daemonset's own pod names
# change on every node reschedule, so this one is list/get with no name
# restriction, scoped to exactly one namespace and exactly pods plus
# pods/log, nothing else.
#
# the ClusterSPIFFEID and AuthPolicy grants live in spear-shield-agents,
# the console backend's own usual territory. the keycloak-initial-admin
# secret grant is different: that secret lives in the keycloak namespace,
# labeled app.kubernetes.io/part-of: rhoai-agent-pack, the same shared
# keycloak server this project's own realm (manifests/spear-shield-agents/01-keycloak-realm.yaml)
# is imported into. confirmed live before adding this: that namespace
# only ever hosts two realm imports, spear-shield-agents-realm (this
# project's own) and sso (the openshift console login realm this
# project's own personas also need, PHASE2_PLAN.md section 8), no other
# agent-pack tenant realm or workload lives there, so a read only, single
# named secret grant here carries no real cross tenant risk despite the
# label.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: owner-console-backend-spiffeid-reader
rules:
  - apiGroups: [spire.spiffe.io]
    resources: [clusterspiffeids]
    resourceNames: [spear-shield-agents-sandboxes]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: owner-console-backend-spiffeid-reader
subjects:
  - kind: ServiceAccount
    name: phase1-ingestion-console-backend
    namespace: spear-console
roleRef:
  kind: ClusterRole
  name: owner-console-backend-spiffeid-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: owner-console-backend-authpolicy-reader
  namespace: spear-shield-agents
rules:
  - apiGroups: [kuadrant.io]
    resources: [authpolicies]
    resourceNames: [spear-retrieval-a2a-auth]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: owner-console-backend-authpolicy-reader
  namespace: spear-shield-agents
subjects:
  - kind: ServiceAccount
    name: phase1-ingestion-console-backend
    namespace: spear-console
roleRef:
  kind: Role
  name: owner-console-backend-authpolicy-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: owner-console-backend-spire-agent-log-reader
  namespace: zero-trust-workload-identity-manager
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: owner-console-backend-spire-agent-log-reader
  namespace: zero-trust-workload-identity-manager
subjects:
  - kind: ServiceAccount
    name: phase1-ingestion-console-backend
    namespace: spear-console
roleRef:
  kind: Role
  name: owner-console-backend-spire-agent-log-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: owner-console-backend-keycloak-admin-secret-reader
  namespace: keycloak
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [keycloak-initial-admin]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: owner-console-backend-keycloak-admin-secret-reader
  namespace: keycloak
subjects:
  - kind: ServiceAccount
    name: phase1-ingestion-console-backend
    namespace: spear-console
roleRef:
  kind: Role
  name: owner-console-backend-keycloak-admin-secret-reader
  apiGroup: rbac.authorization.k8s.io
