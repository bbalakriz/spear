version: 1
filesystem_policy:
  include_workdir: true
  read_only:
    - /usr
    - /lib
    - /lib64
    - /opt
    - /etc
    - /proc
    - /dev/urandom
  read_write:
    - /sandbox
    - /tmp
    - /dev/null
landlock:
  compatibility: best_effort
network_policies:
  cluster_auth:
    name: cluster-auth
    endpoints:
      # the sandbox supervisor's own token_grant provider needs to reach
      # keycloak to mint this sandbox's workload access token. goes
      # straight to keycloak's own real https route now, confirmed live
      # openshell 0.0.116 does tls to the real backend automatically for
      # a plain rest endpoint on port 443, no separate protocol literal
      # needed. an earlier pass here went through a plaintext relay on
      # the wrong assumption that the rest proxy could not do tls at all
      - host: SSO_HOST_PLACEHOLDER
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-write
        # no allowed_ips here on purpose, this is the one endpoint in this
        # policy that is not an in cluster service. confirmed live the
        # wildcard apps route resolves to 10.10.10.101, outside both the
        # cluster and service network cidrs used everywhere else below, so
        # restricting to those two cidrs would wrongly block this one
    binaries:
      - path: /usr/bin/python3*
      - path: /usr/local/bin/python3*
      - path: /opt/app-root/bin/python3*
  cluster_guardrails:
    name: cluster-guardrails
    endpoints:
      # the generation model call, glm-53-flash's own real tool calling
      # confirmed live before this policy was written, not assumed. goes
      # straight to spear-guardrails's own real route, not ogx
      # directly, coordinator-agent-config's own input/output rails run
      # here and it forwards to the real model itself, see that config's
      # own comment. an externally routed hostname, same shape as
      # cluster_auth above, no allowed_ips for the same reason: the
      # wildcard apps route resolves outside the cluster/service cidrs
      #
      # NAMESPACE_MIGRATION_PLAN.md: this route now resolves inside
      # spear-guardrails, not rag-phase1, the install script's own
      # route lookup namespace must match
      - host: GUARDRAILS_HOST_PLACEHOLDER
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-write
    binaries:
      - path: /usr/bin/python3*
      - path: /usr/local/bin/python3*
      - path: /opt/app-root/bin/python3*
  cluster_retrieval:
    name: cluster-retrieval
    endpoints:
      # routed through this project's own second, independent openshell
      # release, see manifests/spear-shield-agents/07-a2a-gateway.yaml
      - host: spear-retrieval-a2a-gateway.spear-shield-agents.svc.cluster.local
        port: 80
        protocol: rest
        enforcement: enforce
        access: read-write
        allowed_ips:
          - CLUSTER_NETWORK_CIDR_PLACEHOLDER
          - SERVICE_NETWORK_CIDR_PLACEHOLDER
    binaries:
      - path: /usr/bin/python3*
      - path: /usr/local/bin/python3*
      - path: /opt/app-root/bin/python3*
  cluster_mlflow:
    name: cluster-mlflow
    endpoints:
      # the real, in process mlflow tracing in main.py, PHASE3_PLAN.md
      # section 4. an externally routed hostname, same shape as
      # cluster_auth and cluster_guardrails above, no allowed_ips for the
      # same reason, the wildcard apps route resolves outside the
      # cluster/service cidrs
      - host: MLFLOW_HOST_PLACEHOLDER
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-write
    binaries:
      - path: /usr/bin/python3*
      - path: /usr/local/bin/python3*
      - path: /opt/app-root/bin/python3*
