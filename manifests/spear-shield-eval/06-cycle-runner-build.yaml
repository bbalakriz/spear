# ImageStream + BuildConfig for evalhub-cycle-runner, same binary docker
# build shape 04-confidential-data-provider-build.yaml already uses, built
# with `oc start-build evalhub-cycle-runner --from-dir=scripts --wait -n
# spear-shield-eval` so the image lands in this cluster's own internal
# registry, where 07-cycle-runner-cronjob.yaml's own CronJob can pull it.
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: evalhub-cycle-runner
  namespace: spear-shield-eval
  labels:
    app: evalhub-cycle-runner
spec: {}
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: evalhub-cycle-runner
  namespace: spear-shield-eval
  labels:
    app: evalhub-cycle-runner
spec:
  source:
    type: Binary
    binary: {}
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Containerfile.evalhub-cycle-runner
  output:
    to:
      kind: ImageStreamTag
      name: evalhub-cycle-runner:latest
  triggers: []
