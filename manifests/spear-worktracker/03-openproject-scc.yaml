# the openproject docker image's own postgres readiness check does
# `su postgres -c psql ...` internally, an os level privilege switch that
# needs root, found live by reading /app/docker/prod/supervisord inside
# the running container after the default restricted SCC's random
# non-root uid made every su call fail with "su: Authentication failure".
# anyuid is the standard openshift answer for images that assume root,
# scoped to only the one service account this pod runs as.
#
# NAMESPACE_MIGRATION_PLAN.md: moved here alongside spear-openproject
# itself
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spear-openproject-anyuid
  namespace: spear-worktracker
subjects:
  - kind: ServiceAccount
    name: spear-openproject
    namespace: spear-worktracker
roleRef:
  kind: ClusterRole
  name: system:openshift:scc:anyuid
  apiGroup: rbac.authorization.k8s.io
