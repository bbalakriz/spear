apiVersion: console.openshift.io/v1
kind: ConsolePlugin
metadata:
  name: {{ template "openshift-console-plugin.name" . }}
  labels:
    {{- include "openshift-console-plugin.labels" . | nindent 4 }}
spec:
  displayName: {{ default (printf "%s Plugin" (include "openshift-console-plugin.name" .)) .Values.plugin.description }}
  i18n: 
    loadType: Preload
  backend:
    type: Service
    service:
      name: {{ template "openshift-console-plugin.name" . }}
      namespace: {{ .Release.Namespace }}
      port: {{ .Values.plugin.port }}
      basePath: {{ .Values.plugin.basePath }}
  {{- if .Values.plugin.backendProxy }}
  proxy:
    - alias: {{ .Values.plugin.backendProxy.alias }}
      authorization: {{ .Values.plugin.backendProxy.authorization | default "None" | quote }}
      endpoint:
        type: Service
        service:
          name: {{ .Values.plugin.backendProxy.serviceName }}
          namespace: {{ .Values.plugin.backendProxy.namespace | default .Release.Namespace }}
          port: {{ .Values.plugin.backendProxy.port }}
  {{- end }}
