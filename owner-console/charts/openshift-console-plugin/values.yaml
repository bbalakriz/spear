---
plugin:
  name: "phase1-ingestion-console"
  description: "Knowledge Base"
  image: ""
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []
  replicas: 1
  port: 9443
  securityContext:
    enabled: true
  podSecurityContext:
    enabled: true
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    enabled: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  resources:
    requests:
      cpu: 10m
      memory: 50Mi
  basePath: /
  backendProxy:
    alias: backend
    # UserToken so the console forwards the signed in user's own openshift
    # bearer token to the backend, needed once the backend started calling
    # the kfp pipeline server on the caller's own behalf (run picker, trigger
    # buttons, autorag leaderboard read). mlflow reads still use the
    # backend's own service account regardless of this setting.
    authorization: UserToken
    serviceName: phase1-ingestion-console-backend
    # NAMESPACE_MIGRATION_PLAN.md: moved from rag-phase1 to spear-console
    namespace: spear-console
    port: 8443
  certificateSecretName: ""
  serviceAccount:
    create: true
    annotations: {}
    name: ""
  patcherServiceAccount:
    create: true
    annotations: {}
    name: ""
  jobs:
    patchConsoles:
      enabled: true
      image: "registry.redhat.io/openshift4/ose-tools-rhel9@sha256:ee65b244fc94d5765514c604dc0a288517dcdce68de65128d047622b6b30a618"
      podSecurityContext:
        enabled: true
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containerSecurityContext:
        enabled: true
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          cpu: 10m
          memory: 50Mi
